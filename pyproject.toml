[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-poc"
version = "0.1.0"
description = "Telefon videosundan gercek olcekli 3D yuz modeli + 6 rinoplasti olcumu (PoC)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "numpy",
    "opencv-contrib-python",   # ArUco icin contrib sart
    "open3d",
    "trimesh",
    "pycolmap",                # COLMAP modelini okumak icin (binary ayrica kurulur)
    "pandas",
    "pillow",
]

[project.scripts]
poc = "poc.cli:app"

[tool.setuptools.packages.find]
include = ["poc*"]
