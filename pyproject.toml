[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-poc"
version = "0.5.0"
description = "Telefon videosundan gercek olcekli 3D yuz modeli + 6 rinoplasti olcumu (PoC)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "numpy",
    # ArUco birakildigi icin contrib GEREKMIYOR. Colab'da hazir gelen
    # opencv-python-headless ile contrib yan yana kurulunca cv2 namespace'i
    # yarim yukleniyor (SIFT_create calisirken CascadeClassifier kayboluyor).
    "opencv-python",
    "open3d",
    "trimesh",
    "pycolmap",                # COLMAP modelini okumak icin (binary ayrica kurulur)
    "pandas",
    "pillow",
]

[project.scripts]
poc = "poc.cli:app"

[tool.setuptools.packages.find]
include = ["poc*"]
