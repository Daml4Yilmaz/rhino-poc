[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-poc"
version = "1.3.0"
description = "Metric facial surface reconstruction and rhinoplasty measurements from iPhone capture data"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.9,<5",
    "open3d>=0.18,<1",
    "trimesh>=4,<5",
    "pycolmap>=3.10,<4.2",
    "pandas>=2,<3",
    "pillow>=10,<12",
    "mediapipe==0.10.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
poc = "poc.cli:app"

[tool.setuptools.packages.find]
include = ["poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
